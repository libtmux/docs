name: test

# The publication audit builds the PR preview once. Its immutable artifact
# passes the publisher dry-run before a same-repository PR may publish it.
# Pushes keep the production assembly audit; deploy-shell owns production.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-shell-pr-{0}', github.event.pull_request.number) || format('test-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      preview-artifact-id: ${{ steps.preview-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install audit tools
        run: |
          ./scripts/apt-get.sh update
          ./scripts/apt-get.sh install --no-install-recommends -y ripgrep fd-find
          sudo ln -s /usr/bin/fdfind /usr/local/bin/fd

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python tooling
        run: uv sync --locked

      - name: Install browser for the rendering audit
        run: pnpm --filter @libtmux/site exec playwright install --with-deps chromium

      - name: Resolve integrated guide sources
        id: integrated-sources
        run: |
          {
            echo "ruby=$(jq -r .revision site/src/data/api/ruby.json)"
            echo "lua=$(jq -r .revision site/src/data/api/lua.json)"
            echo "powershell=$(jq -r .revision site/src/data/api/powershell.json)"
            echo "julia=$(jq -r .revision site/src/data/api/julia.json)"
            echo "elixir=$(jq -r .revision site/src/data/api/elixir.json)"
            echo "ocaml=$(jq -r .revision site/src/data/api/ocaml.json)"
            echo "haskell=$(jq -r .revision site/src/data/api/haskell.json)"
            echo "perl=$(jq -r .revision site/src/data/api/perl.json)"
          } >> "$GITHUB_OUTPUT"
          echo "lisp=$(jq -r .revision site/src/data/api/lisp.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-ruby
          ref: ${{ steps.integrated-sources.outputs.ruby }}
          path: .port-sources/ruby
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-lua
          ref: ${{ steps.integrated-sources.outputs.lua }}
          path: .port-sources/lua
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-powershell
          ref: ${{ steps.integrated-sources.outputs.powershell }}
          path: .port-sources/powershell
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-julia
          ref: ${{ steps.integrated-sources.outputs.julia }}
          path: .port-sources/julia
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-elixir
          ref: ${{ steps.integrated-sources.outputs.elixir }}
          path: .port-sources/elixir
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-ocaml
          ref: ${{ steps.integrated-sources.outputs.ocaml }}
          path: .port-sources/ocaml
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-haskell
          ref: ${{ steps.integrated-sources.outputs.haskell }}
          path: .port-sources/haskell
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libtmux/libtmux-perl
          ref: ${{ steps.integrated-sources.outputs.perl }}
          path: .port-sources/perl
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libtmux/libtmux-lisp
          ref: ${{ steps.integrated-sources.outputs.lisp }}
          path: .port-sources/lisp
          persist-credentials: false

      # The exporter tests compile a fixture with the package's own toolchain:
      # the exact pair the integrated Elixir source pins, read as port-docs.yml
      # reads it.
      - name: Read integrated Elixir toolchain
        id: elixir-runtime
        run: python3 scripts/read-elixir-toolchain.py .port-sources/elixir
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ steps.elixir-runtime.outputs.otp-version }}
          elixir-version: ${{ steps.elixir-runtime.outputs.elixir-version }}
          # Exact versions only: a loose match would resolve a moving release.
          version-type: strict
          install-hex: true

      - name: Cache pinned Rebar3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libtmux-docs-tools/rebar3/rebar3
          key: rebar3-${{ runner.os }}-${{ runner.arch }}-3.28.0-5a28b1cca082d3b023ec0f5df9d9f9d52557036c6f2a21c1ffa11b93a984dd42

      - name: Install pinned Rebar3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rebar_dir="$RUNNER_TEMP/libtmux-docs-tools/rebar3"
          rebar_file="$rebar_dir/rebar3"
          rebar_sha=5a28b1cca082d3b023ec0f5df9d9f9d52557036c6f2a21c1ffa11b93a984dd42
          rebar_download=''
          rebar_install_dir=''
          rebar_ready=false
          cleanup_rebar() {
            if [[ -n "$rebar_download" ]]; then
              rm -f -- "$rebar_download"
            fi
            if [[ "$rebar_ready" != true && -n "$rebar_install_dir" ]]; then
              rm -rf -- "$rebar_install_dir"
            fi
          }
          trap cleanup_rebar EXIT
          mkdir -p "$rebar_dir"
          if [[ ! -f "$rebar_file" ]] || ! printf '%s  %s\n' "$rebar_sha" "$rebar_file" | sha256sum --check --status; then
            rebar_download=$(mktemp "$rebar_dir/.rebar3.XXXXXXXX")
            gh api -H 'Accept: application/octet-stream' \
              repos/erlang/rebar3/releases/assets/664140441 > "$rebar_download"
            printf '%s  %s\n' "$rebar_sha" "$rebar_download" | sha256sum --check --strict
            mv "$rebar_download" "$rebar_file"
          fi
          rebar_install_dir=$(mktemp -d "$RUNNER_TEMP/libtmux-docs-rebar3.XXXXXXXX")
          install -m 755 "$rebar_file" "$rebar_install_dir/rebar3"
          printf '%s  %s\n' "$rebar_sha" "$rebar_install_dir/rebar3" | sha256sum --check --strict
          rebar_version=$(REBAR_GLOBAL_CONFIG_DIR="$RUNNER_TEMP/rebar3-empty-config" \
            REBAR_CONFIG="$RUNNER_TEMP/rebar3-empty.config" "$rebar_install_dir/rebar3" version)
          printf '%s\n' "$rebar_version"
          [[ "$rebar_version" == 'rebar 3.28.0 '* ]]
          printf '%s\n' "$rebar_install_dir" >> "$GITHUB_PATH"
          rebar_ready=true

      - name: Stage integrated source guides
        env:
          LIBTMUX_DOCS_CHECKOUT_RUBY: ${{ github.workspace }}/.port-sources/ruby
          LIBTMUX_DOCS_CHECKOUT_LUA: ${{ github.workspace }}/.port-sources/lua
          LIBTMUX_DOCS_CHECKOUT_POWERSHELL: ${{ github.workspace }}/.port-sources/powershell
          LIBTMUX_DOCS_CHECKOUT_JULIA: ${{ github.workspace }}/.port-sources/julia
          LIBTMUX_DOCS_CHECKOUT_ELIXIR: ${{ github.workspace }}/.port-sources/elixir
          LIBTMUX_DOCS_CHECKOUT_OCAML: ${{ github.workspace }}/.port-sources/ocaml
          LIBTMUX_DOCS_CHECKOUT_HASKELL: ${{ github.workspace }}/.port-sources/haskell
          LIBTMUX_DOCS_CHECKOUT_PERL: ${{ github.workspace }}/.port-sources/perl
          LIBTMUX_DOCS_CHECKOUT_LISP: ${{ github.workspace }}/.port-sources/lisp
        run: |
          node scripts/stage-port-docs.mjs --from-source
          node scripts/stage-port-docs.mjs --cached --check

      # Unit tests, lint, type-check, a real shell build, then the suites that
      # read built HTML, the link check and the API fidelity check — ordered
      # cheapest-first inside the script so a failure arrives as early as it
      # can.
      - name: test-all
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            pnpm test:publication --preview "$PREVIEW_PREFIX"
          else
            pnpm test:publication
          fi
        env:
          PREVIEW_PREFIX: pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_CHECKOUT_RUBY: ${{ github.workspace }}/.port-sources/ruby
          LIBTMUX_DOCS_CHECKOUT_LUA: ${{ github.workspace }}/.port-sources/lua
          LIBTMUX_DOCS_CHECKOUT_OCAML: ${{ github.workspace }}/.port-sources/ocaml
          LIBTMUX_DOCS_CHECKOUT_LISP: ${{ github.workspace }}/.port-sources/lisp
          # PowerShell, Julia, Elixir, Haskell and Perl paths stay scoped to guide staging
          # above, which checks the cache used by ordinary builds. Native API
          # and MCP export freshness remain owning-port checks, not claims of
          # this root audit. Elixir's exporter tests run in the unit step; its
          # committed model is derived again by port-docs.yml at publication.
          # OCaml's checkout also feeds source-derived usage checks. Its
          # compiled API is qualified by the owning port's exporter job.
          # Common Lisp's checkout stays available here so example sources are checked against the exact revision.
          LIBTMUX_DOCS_SKIP_NATIVE_MODEL_PORTS: ruby,lua,powershell,julia,elixir,ocaml,haskell,perl,lisp

      - name: Upload audited preview
        if: github.event_name == 'pull_request'
        id: preview-artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: _site/pr-${{ github.event.pull_request.number }}/
          if-no-files-found: error
          retention-days: 1

  # No credentials or OIDC in the audit or dry-run, including fork PRs.
  check-publish-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.test.outputs.preview-artifact-id }}
          digest-mismatch: error
          path: _site
      - name: Exercise the publisher against the preview assembly
        env:
          LOCALE: en
          BUCKET: reproduction
        run: |
          set -euo pipefail
          node scripts/publication-metadata.mjs
          cp scripts/publish-root.sh publish-root.sh
          cp scripts/large-json.sh large-json.sh
          cp scripts/publish-default-versions.sh publish-default-versions.sh
          mv "_site/$LOCALE" dist
          mkdir bin
          # Prints each call, and answers the two store reads the
          # default-version publisher parses.
          cat > bin/aws <<'SH'
          #!/usr/bin/env bash
          case "$2" in
            describe-key-value-store) echo '{"ETag":"dry-run"}' ;;
            list-keys) echo '{"Items":[]}' ;;
            *) printf 'aws'; printf ' %q' "$@"; printf '\n' ;;
          esac
          SH
          chmod +x bin/aws
          PATH="$PWD/bin:$PATH" bash publish-root.sh

      - name: Exercise the default-version publisher against the preview assembly
        env:
          KVS_ARN: reproduction
        run: |
          set -euo pipefail
          PATH="$PWD/bin:$PATH" bash publish-default-versions.sh

  # Forks are audited but never enter an AWS environment or receive secrets.
  publish-preview:
    needs: [test, check-publish-preview]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      path-prefix: pr-${{ github.event.pull_request.number }}
      artifact: preview-dist
      artifact-id: ${{ needs.test.outputs.preview-artifact-id }}
      version-kind: pr
      environment: docs-preview
    secrets:
      role-arn: ${{ secrets.LIBTMUX_DOCS_PREVIEW_ROLE_ARN }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}
