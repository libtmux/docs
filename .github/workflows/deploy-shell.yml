name: deploy-shell

# Publish the shared shell and latest port documentation. Native API trees
# and historical versions remain owned by their port publishers.
#
# The shell has no versioned URL space of its own (notes/research/06: root
# is always "whatever's on trunk," never /latest/ or /stable/ like a port).
# A tag here is a release marker for this repo's own history; it deploys to
# the same root a trunk push does, not a separate prefix. Release branches
# are a per-port version concept (versions.ts VersionKind 'branch', e.g.
# 'v0.x') with no shell equivalent, so there is deliberately no branch
# trigger here beyond the default branch.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-shell-pr-{0}', github.event.pull_request.number) || 'deploy-shell' }}
  # A preview of a superseded commit is worth nothing, so a new push replaces
  # the run it obsoletes. Queueing them instead made six runs pile up behind
  # one another in twenty minutes, each waiting out the one before it.
  #
  # Never for a push to trunk: that job syncs S3 and invalidates CloudFront,
  # and a deploy cancelled halfway through leaves the site inconsistent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The locale list comes from site/src/i18n/locales.ts, the same module the
  # assembly and the switcher read, so adding a locale needs no edit here.
  # A matrix over a hand-written list would be one more copy to forget.
  locales:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          list=$(node --input-type=module -e "
            const { LOCALES } = await import('./site/src/i18n/locales.ts')
            process.stdout.write(JSON.stringify(LOCALES))
          ")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "locales: $list"

  build:
    if: github.event_name != 'pull_request'
    needs: locales
    runs-on: ubuntu-latest
    strategy:
      # One build per locale. Astro's base changes the URLs a build emits, and
      # a build carries exactly one, so a locale is a separate build rather
      # than a separate output directory of the same one.
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install assembly tools
        if: matrix.locale == 'en'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Build production documentation
        working-directory: site
        env:
          LIBTMUX_DOCS_VERSION: latest
          LIBTMUX_DOCS_VERSION_KIND: trunk
          LIBTMUX_DOCS_IS_DEFAULT: 'true'
          # Locale is the outermost segment. Astro's base changes the URLs it
          # emits, not where it writes them, so dist/ stays flat and the
          # publish step below puts it under the matching prefix.
          LIBTMUX_DOCS_BASE: /${{ matrix.locale }}/
          LIBTMUX_DOCS_ROOT: /${{ matrix.locale }}/
          LIBTMUX_DOCS_LOCALE: ${{ matrix.locale }}
          # The port trees and the reference are built in the default locale
          # only, so every locale links across to them.
          LIBTMUX_DOCS_PORT_ROOT: /en
          LIBTMUX_DOCS_SITE: https://libtmux.org
        run: |
          if [[ '${{ matrix.locale }}' == en ]]; then
            pnpm --workspace-root build:site --versions latest
          else
            pnpm build
          fi

      # publish-root needs the port slugs to know which prefixes it must not
      # bulk-touch, and it has no checkout of its own. Emitting the list here
      # ties it to the commit that produced the tree, which a second hand-kept
      # copy in that job could not do.
      - name: Emit publication ownership metadata
        if: matrix.locale == 'en'
        run: |
          set -euo pipefail
          node scripts/publication-metadata.mjs
          cat reserved-prefixes.txt

      - uses: actions/upload-artifact@v7
        with:
          name: shell-dist-${{ matrix.locale }}
          path: ${{ matrix.locale == 'en' && '_site/en' || 'site/dist' }}
          retention-days: 1

      # Identical in every matrix leg, so only one writes it.
      - uses: actions/upload-artifact@v7
        if: matrix.locale == 'en'
        with:
          name: reserved-prefixes
          path: |
            reserved-prefixes.txt
            reserved-products.txt
            shell-paths.json
            scripts/publish-root.sh
          retention-days: 1

  build-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
      - run: pnpm install --frozen-lockfile
      - name: Assemble and check preview
        env:
          PREVIEW_PREFIX: pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_LOCALES_ROOT: /pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_VERSION: pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_VERSION_KIND: pr
          LIBTMUX_DOCS_IS_DEFAULT: 'false'
        run: |
          pnpm build:site
          bash scripts/check-preview.sh _site "$PREVIEW_PREFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: _site/pr-${{ github.event.pull_request.number }}/
          if-no-files-found: error
          retention-days: 1

  # Same-repo PRs only. Fork PRs get no secrets on `pull_request` by
  # design (a fork's build step above still runs, with no OIDC and no
  # secrets in scope — GITHUB_TOKEN aside — so a malicious build script
  # gains nothing); this job's `if` is what keeps it that way, not the
  # trigger.
  #
  # The repository went public on 2026-09-06, so a fork pull request is now
  # a real scenario rather than a hypothetical one. The guard is unchanged
  # and still correct: a fork PR builds and is checked, and simply gets no
  # preview URL. That is a degraded experience, not an exposure.
  #
  # The documented improvement is a `workflow_run` handoff that publishes a
  # fork's already-built artifact from a trusted context. It is deliberately
  # NOT taken here: such a workflow runs with secrets against a ref the
  # forker controls, and every published mistake in that pattern comes from
  # trusting `head_sha` or `head_repository` without re-validating them. It
  # is worth building carefully, on its own, with its own review — not
  # bolted on the day the repo's visibility changed. Widening this `if` is
  # never the answer (notes/research/06, 07).
  publish-preview:
    needs: build-preview
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      path-prefix: pr-${{ github.event.pull_request.number }}
      artifact: preview-dist
      version-kind: pr
      environment: docs-preview
    secrets:
      role-arn: ${{ secrets.LIBTMUX_DOCS_PREVIEW_ROLE_ARN }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}

  check-publish:
    if: github.event_name != 'pull_request'
    needs: [locales, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shell-dist-${{ matrix.locale }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: reserved-prefixes
      - name: Exercise the production publisher without uploading
        env:
          LOCALE: ${{ matrix.locale }}
          BUCKET: reproduction
        run: |
          set -euo pipefail
          # A recording stand-in: the run must reach the same decisions it
          # would in production, and upload nothing while doing so.
          mkdir bin
          printf '%s\n' '#!/usr/bin/env bash' 'printf "aws"; printf " %q" "$@"; printf "\\n"' > bin/aws
          chmod +x bin/aws
          PATH="$PWD/bin:$PATH" bash scripts/publish-root.sh

  publish-root:
    needs: [locales, build, check-publish]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Serially, not in parallel: every leg writes the bucket-root files
      # (robots.txt) and creates an invalidation, and two legs racing there
      # would have one of them win arbitrarily.
      max-parallel: 1
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    environment: docs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shell-dist-${{ matrix.locale }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: reserved-prefixes

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.LIBTMUX_DOCS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync top-level directories, denylist-checked
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
          LOCALE: ${{ matrix.locale }}
        run: bash scripts/publish-root.sh

      # Only the two entry points, and only because they are the pages a
      # person checks first after a deploy. Everything else is written with
      # `s-maxage=300`, so the edge refreshes it within five minutes on its
      # own — an invalidation there buys five minutes and nothing else.
      #
      # This used to enumerate every root file, every top-level directory and
      # every port landing page: around thirty paths per locale, per deploy,
      # against a 1,000-path monthly free tier. A wildcard counts as one path
      # however many objects it matches, so the bill was cents rather than the
      # hundreds a per-object model would suggest — but the paths bought
      # almost nothing, which is the actual reason they are gone.
      - name: Invalidate the entry points
        run: |
          set -euo pipefail
          locale=$(cat "$RUNNER_TEMP/shell-locale.txt")
          # This locale's landing page, and nothing else. The locale comes from
          # this matrix leg, so the Japanese publish refreshes /ja/ rather than
          # a tree it did not write.
          #
          # `/` is deliberately absent. The edge function answers it directly,
          # so CloudFront never caches it — a request returns
          # `x-cache: FunctionGeneratedResponse from cloudfront` every time,
          # and Cloudflare reports it `DYNAMIC`. Invalidating a URL that is
          # generated per request spends a path to clear an entry that does not
          # exist. `/<locale>/` by contrast is a real object: it answers
          # `Hit from cloudfront` with an age.
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}" \
            --paths "/$locale/"
