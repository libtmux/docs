name: deploy-shell

# Publish the shared shell and latest port documentation. Native API trees
# and historical versions remain owned by their port publishers.
#
# The shell has no versioned URL space of its own (notes/research/06: root
# is always "whatever's on trunk," never /latest/ or /stable/ like a port).
# A tag here is a release marker for this repo's own history; it deploys to
# the same root a trunk push does, not a separate prefix. Release branches
# are a per-port version concept (versions.ts VersionKind 'branch', e.g.
# 'v0.x') with no shell equivalent, so there is deliberately no branch
# trigger here beyond the default branch.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-shell-pr-{0}', github.event.pull_request.number) || 'deploy-shell' }}
  # A preview of a superseded commit is worth nothing, so a new push replaces
  # the run it obsoletes. Queueing them instead made six runs pile up behind
  # one another in twenty minutes, each waiting out the one before it.
  #
  # Never for a push to trunk: that job syncs S3 and invalidates CloudFront,
  # and a deploy cancelled halfway through leaves the site inconsistent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The locale list comes from site/src/i18n/locales.ts, the same module the
  # assembly and the switcher read, so adding a locale needs no edit here.
  # A matrix over a hand-written list would be one more copy to forget.
  locales:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          list=$(node --input-type=module -e "
            const { LOCALES } = await import('./site/src/i18n/locales.ts')
            process.stdout.write(JSON.stringify(LOCALES))
          ")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "locales: $list"

  build:
    if: github.event_name != 'pull_request'
    needs: locales
    runs-on: ubuntu-latest
    strategy:
      # One build per locale. Astro's base changes the URLs a build emits, and
      # a build carries exactly one, so a locale is a separate build rather
      # than a separate output directory of the same one.
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install assembly tools
        if: matrix.locale == 'en'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Build production documentation
        working-directory: site
        env:
          LIBTMUX_DOCS_VERSION: latest
          LIBTMUX_DOCS_VERSION_KIND: trunk
          LIBTMUX_DOCS_IS_DEFAULT: 'true'
          # Locale is the outermost segment. Astro's base changes the URLs it
          # emits, not where it writes them, so dist/ stays flat and the
          # publish step below puts it under the matching prefix.
          LIBTMUX_DOCS_BASE: /${{ matrix.locale }}/
          LIBTMUX_DOCS_ROOT: /${{ matrix.locale }}/
          LIBTMUX_DOCS_LOCALE: ${{ matrix.locale }}
          # The port trees and the reference are built in the default locale
          # only, so every locale links across to them.
          LIBTMUX_DOCS_PORT_ROOT: /en
          LIBTMUX_DOCS_SITE: https://libtmux.org
        run: |
          if [[ '${{ matrix.locale }}' == en ]]; then
            pnpm --workspace-root build:site --versions latest
          else
            pnpm build
          fi

      # publish-root needs the port slugs to know which prefixes it must not
      # bulk-touch, and it has no checkout of its own. Emitting the list here
      # ties it to the commit that produced the tree, which a second hand-kept
      # copy in that job could not do.
      - name: Emit publication ownership metadata
        if: matrix.locale == 'en'
        run: |
          set -euo pipefail
          node --input-type=module -e "
            const { readdirSync, rmSync, writeFileSync } = await import('node:fs')
            const { PORTS, DOC_PRODUCTS } = await import('./site/src/lib/ports.ts')
            const { DEFAULT_LOCALE } = await import('./site/src/i18n/locales.ts')
            const paths = { schema: 1, locale: DEFAULT_LOCALE, directories: [], files: [] }
            for (const port of PORTS) {
              const prefix = port.slug + '/latest'
              for (const entry of readdirSync('_site/' + DEFAULT_LOCALE + '/' + prefix, { withFileTypes: true })) {
                if (entry.isSymbolicLink()) throw new Error('Unexpected symlink in shell assembly: ' + prefix + '/' + entry.name)
                // The assembly checks native targets; this artifact never publishes them.
                if (entry.name === 'api') {
                  rmSync('_site/' + DEFAULT_LOCALE + '/' + prefix + '/api', { recursive: true })
                  continue
                }
                paths[entry.isDirectory() ? 'directories' : 'files'].push(prefix + '/' + entry.name)
              }
            }
            writeFileSync('shell-paths.json', JSON.stringify(paths) + '\n')
            writeFileSync('reserved-products.txt', Object.keys(DOC_PRODUCTS).join('\n') + '\n')
            process.stdout.write(PORTS.map((p) => p.slug).join('\n') + '\n')
          " > reserved-prefixes.txt
          cat reserved-prefixes.txt

      - uses: actions/upload-artifact@v7
        with:
          name: shell-dist-${{ matrix.locale }}
          path: ${{ matrix.locale == 'en' && '_site/en' || 'site/dist' }}
          retention-days: 1

      # Identical in every matrix leg, so only one writes it.
      - uses: actions/upload-artifact@v7
        if: matrix.locale == 'en'
        with:
          name: reserved-prefixes
          path: |
            reserved-prefixes.txt
            reserved-products.txt
            shell-paths.json
          retention-days: 1

  build-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
      - run: pnpm install --frozen-lockfile
      - name: Assemble and check preview
        env:
          PREVIEW_PREFIX: pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_LOCALES_ROOT: /pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_VERSION: pr-${{ github.event.pull_request.number }}
          LIBTMUX_DOCS_VERSION_KIND: pr
          LIBTMUX_DOCS_IS_DEFAULT: 'false'
        run: |
          pnpm build:site
          bash scripts/check-preview.sh _site "$PREVIEW_PREFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: _site/pr-${{ github.event.pull_request.number }}/
          if-no-files-found: error
          retention-days: 1

  # Same-repo PRs only. Fork PRs get no secrets on `pull_request` by
  # design (a fork's build step above still runs, with no OIDC and no
  # secrets in scope — GITHUB_TOKEN aside — so a malicious build script
  # gains nothing); this job's `if` is what keeps it that way, not the
  # trigger.
  #
  # The repository went public on 2026-09-06, so a fork pull request is now
  # a real scenario rather than a hypothetical one. The guard is unchanged
  # and still correct: a fork PR builds and is checked, and simply gets no
  # preview URL. That is a degraded experience, not an exposure.
  #
  # The documented improvement is a `workflow_run` handoff that publishes a
  # fork's already-built artifact from a trusted context. It is deliberately
  # NOT taken here: such a workflow runs with secrets against a ref the
  # forker controls, and every published mistake in that pattern comes from
  # trusting `head_sha` or `head_repository` without re-validating them. It
  # is worth building carefully, on its own, with its own review — not
  # bolted on the day the repo's visibility changed. Widening this `if` is
  # never the answer (notes/research/06, 07).
  publish-preview:
    needs: build-preview
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      path-prefix: pr-${{ github.event.pull_request.number }}
      artifact: preview-dist
      version-kind: pr
      environment: docs-preview
    secrets:
      role-arn: ${{ secrets.LIBTMUX_DOCS_PREVIEW_ROLE_ARN }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}

  check-publish:
    if: github.event_name != 'pull_request'
    needs: [locales, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shell-dist-${{ matrix.locale }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: reserved-prefixes
      - name: Exercise the production publisher without uploading
        env:
          LOCALE: ${{ matrix.locale }}
          BUCKET: reproduction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-shell.yml').read_text()
          step = workflow.split('      - name: Sync top-level directories, denylist-checked\n', 1)[1]
          block = step.split('        run: |\n', 1)[1]
          lines = []
          for line in block.splitlines():
              if line.strip() and not line.startswith('          '):
                  break
              lines.append(line)
          script = textwrap.dedent('\n'.join(lines))
          script = re.sub(r'\$\{\{\s*matrix\.locale\s*\}\}', os.environ['LOCALE'], script)
          Path('publish-root.sh').write_text(script)
          Path('bin').mkdir()
          aws = Path('bin/aws')
          aws.write_text('#!/usr/bin/env bash\nprintf "aws"; printf " %q" "$@"; printf "\\n"\n')
          aws.chmod(0o755)
          PY
          export PATH="$PWD/bin:$PATH"
          bash publish-root.sh

  publish-root:
    needs: [locales, build, check-publish]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Serially, not in parallel: every leg writes the bucket-root files
      # (robots.txt) and creates an invalidation, and two legs racing there
      # would have one of them win arbitrarily.
      max-parallel: 1
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    environment: docs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shell-dist-${{ matrix.locale }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: reserved-prefixes

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.LIBTMUX_DOCS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync top-level directories, denylist-checked
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
        run: |
          set -euo pipefail
          locale="${{ matrix.locale }}"
          # The artifact declares the shell-owned ports, products and paths. Missing
          # metadata must never turn a reserved port into an unrestricted sync.
          for metadata in reserved-prefixes.txt reserved-products.txt shell-paths.json; do
            if [[ ! -s "$metadata" ]]; then
              echo "::error::$metadata is missing or empty" >&2
              exit 1
            fi
          done
          mapfile -t reserved < reserved-prefixes.txt
          mapfile -t products < reserved-products.txt
          if ! jq -e '.schema == 1 and (.locale | type == "string") and (.directories | type == "array") and (.files | type == "array") and (all(.directories[], .files[]; type == "string"))' shell-paths.json > /dev/null; then
            echo '::error::invalid shell-paths.json ownership metadata' >&2
            exit 1
          fi
          port_locale=$(jq -r '.locale' shell-paths.json)
          mapfile -t shell_dirs < <(jq -r '.directories[]' shell-paths.json)
          mapfile -t shell_files < <(jq -r '.files[]' shell-paths.json)
          for name in "${reserved[@]}" "${products[@]}" "$port_locale"; do
            if [[ ! "$name" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "::error::invalid ownership name '$name'" >&2
              exit 1
            fi
          done
          reserved+=(manifest)
          shopt -s nullglob dotglob globstar
          # Validate the entire artifact before the first AWS operation.
          # Following links could publish files outside the validated subtree.
          for entry in dist dist/**; do
            if [[ -L "$entry" ]]; then
              echo "::error::symlink in publication artifact: $entry" >&2
              exit 1
            fi
          done
          for path in "${shell_dirs[@]}" "${shell_files[@]}"; do
            if [[ ! "$path" =~ ^([a-z][a-z0-9-]*)/latest/([a-zA-Z0-9_][a-zA-Z0-9_.-]*)$ ]]; then
              echo "::error::invalid shell-owned path: $path" >&2
              exit 1
            fi
            port=${BASH_REMATCH[1]}
            child=${BASH_REMATCH[2]}
            known=false
            for candidate in "${reserved[@]}"; do
              [[ "$port" == "$candidate" ]] && known=true && break
            done
            if [[ "$known" == false || "$port" == manifest || "$child" == api ]]; then
              echo "::error::$path is outside shell-owned paths" >&2
              exit 1
            fi
          done
          if [[ "$locale" == "$port_locale" ]]; then
            for path in "${shell_dirs[@]}"; do
              [[ -d "dist/$path" ]] || { echo "::error::missing shell directory: $path" >&2; exit 1; }
            done
            for path in "${shell_files[@]}"; do
              [[ -f "dist/$path" ]] || { echo "::error::missing shell file: $path" >&2; exit 1; }
            done
            for port in "${reserved[@]}"; do
              [[ "$port" == manifest ]] && continue
              for path in index.html "${products[@]/%//index.html}"; do
                [[ -f "dist/$port/latest/$path" ]] || { echo "::error::missing version entry page: $port/latest/$path" >&2; exit 1; }
              done
            done
          fi
          dirs=()
          reserved_index_dirs=()
          version_files=()
          for entry in dist/*; do
            [[ -d "$entry" ]] || continue
            name=${entry##*/}
            is_reserved=false
            for port in "${reserved[@]}"; do
              [[ "$name" == "$port" ]] && is_reserved=true && break
            done
            if [[ "$is_reserved" == false ]]; then
              dirs+=("$name")
              continue
            fi
            if [[ "$name" == manifest || ! -f "$entry/index.html" ]]; then
              echo "::error::$entry is not a shell-owned port landing tree" >&2
              exit 1
            fi
            for child in "$entry"/*; do
              [[ "$child" == "$entry/index.html" ]] && continue
              if [[ "$child" != "$entry/latest" || ! -d "$child" ]]; then
                echo "::error::$child is outside shell-owned latest paths" >&2
                exit 1
              fi
              for shell_entry in "$child"/*; do
                path=${shell_entry#dist/}
                allowed=false
                if [[ -d "$shell_entry" ]]; then
                  for candidate in "${shell_dirs[@]}"; do
                    [[ "$path" == "$candidate" ]] && allowed=true && break
                  done
                  dirs+=("$path")
                elif [[ -f "$shell_entry" ]]; then
                  for candidate in "${shell_files[@]}"; do
                    [[ "$path" == "$candidate" ]] && allowed=true && break
                  done
                  version_files+=("$path")
                fi
                if [[ "$allowed" == false ]]; then
                  echo "::error::$shell_entry is outside declared shell-owned paths" >&2
                  exit 1
                fi
              done
            done
            reserved_index_dirs+=("$name")
          done

          # Each deleting sync owns one shell subtree, never a locale, port,
          # or version root shared with a native documentation publisher.
          for name in "${dirs[@]}"; do
            aws s3 sync "dist/$name/" "s3://$BUCKET/$locale/$name/" \
              --delete \
              --cache-control "public, max-age=0, s-maxage=300"
          done
          for name in "${reserved_index_dirs[@]}"; do
            aws s3 cp "dist/$name/index.html" "s3://$BUCKET/$locale/$name/index.html" \
              --cache-control "public, max-age=0, s-maxage=300"
          done
          for path in "${version_files[@]}"; do
            aws s3 cp "dist/$path" "s3://$BUCKET/$locale/$path" \
              --cache-control "public, max-age=0, s-maxage=300"
          done
          for file in dist/*; do
            [[ -f "$file" ]] || continue
            aws s3 cp "$file" "s3://$BUCKET/$locale/${file##*/}" \
              --cache-control "public, max-age=0, s-maxage=300"
          done
          if [[ -f dist/robots.txt ]]; then
            aws s3 cp dist/robots.txt "s3://$BUCKET/robots.txt" \
              --cache-control "public, max-age=0, s-maxage=300"
          fi

          # Only the locale crosses into the next step now. The three lists
          # that used to be written here fed the per-path invalidation and
          # have no other reader.
          printf '%s\n' "$locale" > "$RUNNER_TEMP/shell-locale.txt"

      # Only the two entry points, and only because they are the pages a
      # person checks first after a deploy. Everything else is written with
      # `s-maxage=300`, so the edge refreshes it within five minutes on its
      # own — an invalidation there buys five minutes and nothing else.
      #
      # This used to enumerate every root file, every top-level directory and
      # every port landing page: around thirty paths per locale, per deploy,
      # against a 1,000-path monthly free tier. A wildcard counts as one path
      # however many objects it matches, so the bill was cents rather than the
      # hundreds a per-object model would suggest — but the paths bought
      # almost nothing, which is the actual reason they are gone.
      - name: Invalidate the entry points
        run: |
          set -euo pipefail
          locale=$(cat "$RUNNER_TEMP/shell-locale.txt")
          # This locale's landing page, and nothing else. The locale comes from
          # this matrix leg, so the Japanese publish refreshes /ja/ rather than
          # a tree it did not write.
          #
          # `/` is deliberately absent. The edge function answers it directly,
          # so CloudFront never caches it — a request returns
          # `x-cache: FunctionGeneratedResponse from cloudfront` every time,
          # and Cloudflare reports it `DYNAMIC`. Invalidating a URL that is
          # generated per request spends a path to clear an entry that does not
          # exist. `/<locale>/` by contrast is a real object: it answers
          # `Hit from cloudfront` with an age.
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}" \
            --paths "/$locale/"
