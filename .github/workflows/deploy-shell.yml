name: deploy-shell

# Publish the shared shell and latest port documentation. Native API trees
# and historical versions remain owned by their port publishers.
#
# The shell has no versioned URL space of its own (notes/research/06: root
# is always "whatever's on trunk," never /latest/ or /stable/ like a port).
# A tag here is a release marker for this repo's own history; it deploys to
# the same root a trunk push does, not a separate prefix. Release branches
# are a per-port version concept (versions.ts VersionKind 'branch', e.g.
# 'v0.x') with no shell equivalent, so there is deliberately no branch
# trigger here beyond the default branch.
#
# A port release changes the install commands without changing this
# repository, so the deploy also runs on a schedule and on demand. Those runs resolve
# the package registry first and rebuild only when it moved.

on:
  push:
    branches: [main]
    tags: ['v*']
  # Four chances an hour, off the busy top of the hour. GitHub runs a
  # schedule best-effort and drops slots under load: at one an hour, three
  # of five slots in a row never ran while a new release waited. A run whose
  # registry has not moved skips the build in about a minute.
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shell
  # Let each production sync finish before the next one starts.
  cancel-in-progress: false

jobs:
  # The locale list comes from site/src/i18n/locales.ts, the same module the
  # assembly and the switcher read, so adding a locale needs no edit here.
  # A matrix over a hand-written list would be one more copy to forget.
  locales:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          list=$(node --input-type=module -e "
            const { LOCALES } = await import('./site/src/i18n/locales.ts')
            process.stdout.write(JSON.stringify(LOCALES))
          ")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "locales: $list"

  # Every install command on the site is composed from this file. A deploy
  # resolves it against the live registries, falling back to the copy the site
  # last published, so a release reaches readers without a commit here. A pull
  # request builds from the committed file instead, and its result never
  # depends on another repository publishing.
  registry:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - id: resolve
        env:
          # Release tags come from the GitHub API, which allows 60 calls an
          # hour without a token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! curl -fsS --retry 3 --max-time 30 \
              https://libtmux.org/registry.json -o published.json; then
            echo "::notice::No published registry; falling back to the committed file"
            cp site/src/data/registry.json published.json
          fi
          mkdir resolved
          node scripts/gen-registry.mjs --baseline published.json --out resolved/registry.json
          if cmp -s published.json resolved/registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            summary='Unchanged since the last publish.'
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            diff -u published.json resolved/registry.json > registry.diff || test $? -eq 1
            summary=$(tail -n +3 registry.diff | sed 's/^/    /')
          fi
          printf '### Package registry\n\n%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: resolved-registry
          path: resolved/registry.json
          if-no-files-found: error

  build:
    # A scheduled run rebuilds only when the registry moved; a push or a
    # manual run always does.
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.registry.outputs.changed == 'true')
    needs: [locales, registry]
    runs-on: ubuntu-latest
    strategy:
      # One build per locale. Astro's base changes the URLs a build emits, and
      # a build carries exactly one, so a locale is a separate build rather
      # than a separate output directory of the same one.
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: resolved-registry
          path: resolved

      - name: Build from the resolved package registry
        run: cp resolved/registry.json site/src/data/registry.json

      - name: Resolve integrated Ruby and Lua sources
        if: matrix.locale == 'en'
        id: integrated-sources
        run: |
          echo "ruby=$(jq -r .revision site/src/data/api/ruby.json)" >> "$GITHUB_OUTPUT"
          echo "lua=$(jq -r .revision site/src/data/api/lua.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: matrix.locale == 'en'
        with:
          repository: libtmux/libtmux-ruby
          ref: ${{ steps.integrated-sources.outputs.ruby }}
          path: .port-sources/ruby
          persist-credentials: false
      - uses: actions/checkout@v7
        if: matrix.locale == 'en'
        with:
          repository: libtmux/libtmux-lua
          ref: ${{ steps.integrated-sources.outputs.lua }}
          path: .port-sources/lua
          persist-credentials: false

      - name: Install assembly tools
        if: matrix.locale == 'en'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Build production documentation
        working-directory: site
        env:
          LIBTMUX_DOCS_VERSION: latest
          LIBTMUX_DOCS_VERSION_KIND: trunk
          LIBTMUX_DOCS_IS_DEFAULT: 'true'
          # Locale is the outermost segment. Astro's base changes the URLs it
          # emits, not where it writes them, so dist/ stays flat and the
          # publish step below puts it under the matching prefix.
          LIBTMUX_DOCS_BASE: /${{ matrix.locale }}/
          LIBTMUX_DOCS_ROOT: /${{ matrix.locale }}/
          LIBTMUX_DOCS_LOCALE: ${{ matrix.locale }}
          # The port trees and the reference are built in the default locale
          # only, so every locale links across to them.
          LIBTMUX_DOCS_PORT_ROOT: /en
          LIBTMUX_DOCS_SITE: https://libtmux.org
          LIBTMUX_DOCS_CHECKOUT_RUBY: ${{ github.workspace }}/.port-sources/ruby
          LIBTMUX_DOCS_CHECKOUT_LUA: ${{ github.workspace }}/.port-sources/lua
        run: |
          if [[ '${{ matrix.locale }}' == en ]]; then
            pnpm --workspace-root build:site --versions latest
          else
            pnpm build
          fi

      # publish-root needs the port slugs to know which prefixes it must not
      # bulk-touch, and it has no checkout of its own. Emitting the list here
      # ties it to the commit that produced the tree, which a second hand-kept
      # copy in that job could not do.
      - name: Emit publication ownership metadata
        if: matrix.locale == 'en'
        run: |
          set -euo pipefail
          node scripts/publication-metadata.mjs
          # Beside the metadata rather than under scripts/, so the artifact
          # holds it at a path publish-root can name without depending on how
          # upload-artifact roots a multi-path upload.
          cp scripts/publish-root.sh publish-root.sh
          cp scripts/publish-default-versions.sh publish-default-versions.sh
          cp scripts/merge-version-manifests.mjs merge-version-manifests.mjs
          cp scripts/skip-unchanged.mjs skip-unchanged.mjs
          cat reserved-prefixes.txt

      - uses: actions/upload-artifact@v7
        with:
          name: shell-dist-${{ matrix.locale }}
          path: ${{ matrix.locale == 'en' && '_site/en' || 'site/dist' }}
          retention-days: 1

      # Identical in every matrix leg, so only one writes it.
      - uses: actions/upload-artifact@v7
        if: matrix.locale == 'en'
        with:
          name: reserved-prefixes
          path: |
            reserved-prefixes.txt
            reserved-products.txt
            shell-paths.json
            publish-root.sh
            publish-default-versions.sh
            merge-version-manifests.mjs
            skip-unchanged.mjs
          retention-days: 1

  check-publish:
    if: github.event_name != 'pull_request'
    needs: [locales, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shell-dist-${{ matrix.locale }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: reserved-prefixes
      - name: Exercise the production publisher without uploading
        env:
          LOCALE: ${{ matrix.locale }}
          BUCKET: reproduction
        run: |
          set -euo pipefail
          mkdir published-manifests
          node merge-version-manifests.mjs \
            --base dist/versions.json \
            --fragments published-manifests \
            --out dist/versions.json
          # A recording stand-in: the run must reach the same decisions it
          # would in production, and upload nothing while doing so.
          mkdir bin
          # Prints each call, and answers the two store reads the
          # default-version publisher parses.
          cat > bin/aws <<'SH'
          #!/usr/bin/env bash
          case "$2" in
            describe-key-value-store) echo '{"ETag":"dry-run"}' ;;
            list-keys) echo '{"Items":[]}' ;;
            *) printf 'aws'; printf ' %q' "$@"; printf '\n' ;;
          esac
          SH
          chmod +x bin/aws
          PATH="$PWD/bin:$PATH" bash scripts/publish-root.sh

      - name: Exercise the default-version publisher without uploading
        if: matrix.locale == 'en'
        env:
          KVS_ARN: reproduction
        run: |
          set -euo pipefail
          PATH="$PWD/bin:$PATH" bash scripts/publish-default-versions.sh

  publish-root:
    needs: [locales, build, check-publish]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Serially, not in parallel: every leg writes the bucket-root files
      # (robots.txt) and creates an invalidation, and two legs racing there
      # would have one of them win arbitrarily.
      max-parallel: 1
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
    environment: docs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shell-dist-${{ matrix.locale }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: reserved-prefixes

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.LIBTMUX_DOCS_ROLE_ARN }}
          aws-region: us-east-1

      # Every manifest a port has published, whichever ports those are. A
      # port that has never published has no file, which is not an error; a
      # manifest that exists but cannot be read is, and fails the deploy
      # rather than shipping a versions.json that silently lacks it.
      - name: Merge successfully published port versions
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
        run: |
          set -euo pipefail
          mkdir published-manifests
          aws s3 sync "s3://$BUCKET/manifest/" published-manifests/ \
            --exclude '*' --include '*.json' --only-show-errors
          node merge-version-manifests.mjs \
            --base dist/versions.json \
            --fragments published-manifests \
            --out dist/versions.json
          {
            echo "### Port manifests merged into versions.json"
            echo
            find published-manifests -name '*.json' -printf '%f\n' \
              | sed 's/\.json$//' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # Without this every deploy re-uploads the whole locale, unchanged or
      # not. PUBLISH_POLICY_SINCE is the date publish-root.sh last changed a
      # header it sets: an object written before it is re-uploaded whatever
      # its content, so the new header reaches it.
      - name: Skip files the bucket already holds
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
          LOCALE: ${{ matrix.locale }}
          PUBLISH_POLICY_SINCE: '2026-09-27'
        run: |
          node skip-unchanged.mjs --dir dist --bucket "$BUCKET" \
            --prefix "$LOCALE/" --policy-since "$PUBLISH_POLICY_SINCE"

      - name: Sync top-level directories, denylist-checked
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
          LOCALE: ${{ matrix.locale }}
        run: bash publish-root.sh

      - uses: actions/download-artifact@v8
        if: matrix.locale == 'en'
        with:
          name: resolved-registry
          path: resolved

      # The next deploy's fallback, and the record of what this one resolved.
      - name: Publish the resolved package registry
        if: matrix.locale == 'en'
        env:
          BUCKET: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
        run: |
          aws s3 cp resolved/registry.json "s3://$BUCKET/registry.json" \
            --content-type application/json \
            --cache-control 'public, max-age=60, s-maxage=60' \
            --only-show-errors

      # One leg: a row is keyed by port, not locale. LIBTMUX_DOCS_KVS_ARN is
      # the Terraform `key_value_store_arn` output.
      - name: Publish each port's default-version row
        if: matrix.locale == 'en'
        env:
          KVS_ARN: ${{ secrets.LIBTMUX_DOCS_KVS_ARN }}
        run: bash publish-default-versions.sh

      # Only the two entry points, and only because they are the pages a
      # person checks first after a deploy. Everything else is written with
      # `s-maxage=300`, so the edge refreshes it within five minutes on its
      # own — an invalidation there buys five minutes and nothing else.
      #
      # This used to enumerate every root file, every top-level directory and
      # every port landing page: around thirty paths per locale, per deploy,
      # against a 1,000-path monthly free tier. A wildcard counts as one path
      # however many objects it matches, so the bill was cents rather than the
      # hundreds a per-object model would suggest — but the paths bought
      # almost nothing, which is the actual reason they are gone.
      - name: Invalidate the entry points
        run: |
          set -euo pipefail
          locale=$(cat "$RUNNER_TEMP/shell-locale.txt")
          # This locale's landing page, and nothing else. The locale comes from
          # this matrix leg, so the Japanese publish refreshes /ja/ rather than
          # a tree it did not write.
          #
          # `/<locale>/index.html`, not `/<locale>/`. The edge function rewrites a
          # directory URL to its index.html before CloudFront looks the request
          # up, so the landing page is cached under that key, and `/<locale>/`
          # and `/<locale>/index.html` answer with the same age. An invalidation
          # of `/<locale>/` matched nothing: a home page cached a second before
          # its upload outlived it and served stale for the full five minutes.
          #
          # `/` is deliberately absent. The edge function answers it directly,
          # so CloudFront never caches it — a request returns
          # `x-cache: FunctionGeneratedResponse from cloudfront` every time,
          # and Cloudflare reports it `DYNAMIC`. Invalidating a URL that is
          # generated per request spends a path to clear an entry that does not
          # exist.
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}" \
            --paths "/$locale/index.html"
