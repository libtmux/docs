name: port-docs

# Builds a port's documentation tree from the port's own source, one version
# per matrix leg, and uploads each as an artifact for reusable-deploy.yml to
# publish. A port calls both, pinned to the same commit:
#
#   build:
#     uses: libtmux/docs/.github/workflows/port-docs.yml@<sha>  # <release>
#     with: { port: rs, tag-prefix: libtmux@ }
#   publish:
#     needs: build
#     if: needs.build.outputs.should-publish == 'true'
#     strategy: { matrix: '${{ fromJSON(needs.build.outputs.matrix) }}' }
#     uses: libtmux/docs/.github/workflows/reusable-deploy.yml@<sha>  # <release>
#
# The build script comes from this workflow's own commit (job.workflow_sha),
# not from a second pin in the caller, so the script and the publish contract
# cannot drift apart, and one version bump moves both.
#
# Source-bound: the assembly verifies the commit it was given and regenerates
# the port's API reference from it, rather than rendering the copy committed
# in this repository.

on:
  workflow_call:
    inputs:
      port:
        description: Port slug from site/src/lib/ports.ts, e.g. 'rs'.
        required: true
        type: string
      include-wrappers:
        description: Build this library and its wrapper languages from the same source revision.
        required: false
        type: boolean
        default: false
      tag-prefix:
        description: >
          Stripped from a release tag to give its version slug, e.g.
          'libtmux@' for libtmux-rs. Empty for a port whose tags are the
          version itself.
        required: false
        type: string
        default: ''
      # A dispatch's own inputs, passed through by the caller. Read only
      # when the caller's event is workflow_dispatch.
      source-ref:
        required: false
        type: string
        default: ''
      version:
        required: false
        type: string
        default: ''
      version-kind:
        required: false
        type: string
        default: ''
      is-default:
        required: false
        type: boolean
        default: false
      resolves-to:
        required: false
        type: string
        default: ''
      publish:
        required: false
        type: boolean
        default: false
    outputs:
      matrix:
        description: The port and version identities built, as a strategy matrix for reusable-deploy.yml.
        value: ${{ jobs.identity.outputs.matrix }}
      should-publish:
        description: "'true' when any built version is to be published."
        value: ${{ jobs.identity.outputs.should-publish }}

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      source-ref: ${{ steps.identity.outputs.source_ref }}
      matrix: ${{ steps.family.outputs.matrix }}
      should-publish: ${{ steps.identity.outputs.should_publish }}
    steps:
      - name: Validate reusable workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == libtmux/docs && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub Cloud job.workflow_repository/job.workflow_sha are required" >&2
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            scripts
            site/src/lib
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - id: identity
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_KIND: ${{ inputs.version-kind }}
          INPUT_DEFAULT: ${{ inputs.is-default }}
          INPUT_RESOLVES_TO: ${{ inputs.resolves-to }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          TAGS=$(git ls-remote --tags --refs "$REPOSITORY_URL" | sed 's#.*refs/tags/##')
          export TAGS
          bash scripts/port-docs-identity.sh
      - id: family
        env:
          IDENTITY_MATRIX: ${{ steps.identity.outputs.matrix }}
          PORT: ${{ inputs.port }}
          CALLER_REPOSITORY: ${{ github.repository }}
          INCLUDE_WRAPPERS: ${{ inputs.include-wrappers }}
        run: node scripts/port-docs-matrix.mjs

  build:
    needs: identity
    # Match the Clang 18/libc++ distribution used by the selected C++ preset.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    steps:
      - name: Validate reusable workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == libtmux/docs && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub Cloud job.workflow_repository/job.workflow_sha are required" >&2
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.source-ref }}
          fetch-depth: 0
          path: port
          persist-credentials: false

      # The selected ref must be the commit that was checked out; the
      # assembly checks the same thing again before it reads a file.
      - id: source
        working-directory: port
        env:
          SELECTED_REF: ${{ needs.identity.outputs.source-ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          selected=$(git rev-parse "$SELECTED_REF^{commit}")
          [[ "$sha" == "$selected" ]] || {
            echo "selected source resolved to $selected, checkout is $sha" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: docs
          persist-credentials: false

      - name: Resolve Python's separate product sources
        if: inputs.port == 'py'
        id: python-products
        working-directory: docs
        run: |
          for product in workspace mcp; do
            ref=$(jq -er --arg product "$product" '.sources[] | select(.product == $product) | .extractedRevision // .revision' site/src/data/api/py.json)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
            echo "$product=$ref" >> "$GITHUB_OUTPUT"
          done
      - if: inputs.port == 'py'
        uses: actions/checkout@v7
        with:
          repository: tmux-python/tmuxp
          ref: ${{ steps.python-products.outputs.workspace }}
          path: python-workspace
          persist-credentials: false
      - if: inputs.port == 'py'
        uses: actions/checkout@v7
        with:
          repository: tmux-python/libtmux-mcp
          ref: ${{ steps.python-products.outputs.mcp }}
          path: python-mcp
          persist-credentials: false

      # No dependency cache: this job checks out whichever ref it was asked
      # to publish, and a cache it saved could be restored by a later
      # default-branch run.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Snapshot source inputs before native generation
        working-directory: docs
        env:
          LIBTMUX_DOCS_PORT: ${{ matrix.port }}
          LIBTMUX_DOCS_VERSION: ${{ matrix.version }}
          LIBTMUX_DOCS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PORT_CHECKOUT: ${{ github.workspace }}/port
          LIBTMUX_DOCS_WORKSPACE_PY: ${{ github.workspace }}/python-workspace
          LIBTMUX_DOCS_MCP_PY: ${{ github.workspace }}/python-mcp
        run: |
          set -euo pipefail
          export "LIBTMUX_DOCS_CHECKOUT_${LIBTMUX_DOCS_PORT^^}=$PORT_CHECKOUT"
          node scripts/publication-provenance.mjs snapshot "$RUNNER_TEMP/build-inputs.json" "$PWD"

      - name: Resolve MCP availability from the port catalog
        id: mcp
        working-directory: docs
        env:
          PORT: ${{ matrix.port }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { PORT_BY_SLUG, productAvailable } from './site/src/lib/ports.ts'
          const port = PORT_BY_SLUG[process.env.PORT]
          if (!port) throw new Error(`Unknown port: ${process.env.PORT}`)
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${productAvailable(port, 'mcp')}\n`)
          JS

      - name: Read selected Rust and Swift toolchains
        id: native-version
        if: matrix.port == 'rs' || matrix.port == 'swift'
        env:
          PORT: ${{ matrix.port }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          port = os.environ['PORT']
          if port == 'rs':
              version = tomllib.loads(pathlib.Path('port/rust-toolchain.toml').read_text())['toolchain']['channel']
              pattern = r'(?:[0-9]+\.[0-9]+\.[0-9]+|(?:nightly|beta)-[0-9]{4}-[0-9]{2}-[0-9]{2})'
          elif port == 'swift':
              version = tomllib.loads(pathlib.Path('port/.mise.toml').read_text())['tools']['swift']
              pattern = r'[0-9]+\.[0-9]+\.[0-9]+'
          else:
              raise ValueError(f'Unsupported native toolchain: {port}')
          if not isinstance(version, str) or not re.fullmatch(pattern, version):
              raise ValueError(f'{port}: selected source must pin an exact toolchain version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Install native system dependencies
        if: steps.mcp.outputs.required == 'true' || matrix.port == 'cxx'
        env:
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          packages=(tmux)
          if [[ "$PORT" == cxx ]]; then
            packages+=(clang-18 libc++-18-dev libc++abi-18-dev ninja-build)
          fi
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq "${packages[@]}"
          if [[ "$PORT" == cxx ]]; then
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          fi
          tmux -V

      - name: Install tested Doxygen producer
        if: matrix.port == 'cxx'
        working-directory: docs
        run: |
          set -euo pipefail
          version=1.18.0
          archive="$RUNNER_TEMP/doxygen-$version.linux.bin.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-$version.linux.bin.tar.gz"
          printf '%s  %s\n' \
            14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" "doxygen-$version/bin/doxygen"
          bin="$RUNNER_TEMP/doxygen-$version/bin"
          python3 scripts/check-doxygen.py "$bin/doxygen" "$version"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"

      - if: matrix.port == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: port/mcp/go.mod
          cache: false
      - if: matrix.port == 'rs'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.native-version.outputs.version }}
      - if: matrix.port == 'ts'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: port/package.json
          no-cache: true
      - name: Install TypeScript MCP dependencies
        if: matrix.port == 'ts'
        working-directory: port
        run: bun install --frozen-lockfile
      - if: matrix.port == 'java' || matrix.port == 'kotlin' || matrix.port == 'scala'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          # The repository's Gradle conventions compile and run on JDK 25.
          java-version: '25'
      - if: matrix.port == 'java' || matrix.port == 'kotlin' || matrix.port == 'scala'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true
      - if: matrix.port == 'dotnet' || matrix.port == 'fsharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: port/global.json
          cache: false
      - if: matrix.port == 'ruby'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: port
          bundler-cache: false
      - name: Install Ruby MCP dependencies
        if: matrix.port == 'ruby'
        working-directory: port
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install

      - if: inputs.port == 'py'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: '3.14'
      - name: Install Python's native documentation dependencies
        if: inputs.port == 'py'
        working-directory: port
        # Reproduce the selected lock, including resolutions made with
        # contributor-specific package cooldowns.
        run: uv sync --frozen --all-extras --dev
      - name: Install Python's separate MCP runtime
        if: inputs.port == 'py'
        working-directory: python-mcp
        run: uv sync --frozen --no-dev

      # C++'s reference is read from the Doxygen XML its own build produces
      # (scripts/gen-api-model.mjs), which must be newer than the headers it
      # describes, so it is generated here, after the checkout. The same
      # doxygen serves gen-api-model's own run over the workspace and MCP
      # headers.
      - name: Generate the Doxygen XML
        if: matrix.port == 'cxx'
        working-directory: port
        run: |
          set -euo pipefail
          doxygen --version
          OUTPUT_DIRECTORY=. doxygen Doxyfile

      # Swift's reference is read from the symbol graph its compiler emits,
      # for the same reason and with the same freshness check. The resolved
      # versions are forced so the build neither re-resolves nor rewrites
      # Package.resolved.
      - name: Install selected Swift toolchain
        if: matrix.port == 'swift'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        env:
          MISE_SWIFT_GPG_VERIFY: 'true'
        with:
          version: '2026.9.17'
          install_args: swift@${{ steps.native-version.outputs.version }}
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
      - name: Verify selected Swift toolchain
        if: matrix.port == 'swift'
        env:
          SWIFT_VERSION: ${{ steps.native-version.outputs.version }}
        run: |
          set -euo pipefail
          swift_bin=$(mise where "swift@$SWIFT_VERSION")/bin
          actual=$("$swift_bin/swift" --version | sed -nE 's/^(Apple )?Swift version ([0-9.]+).*$/\2/p')
          [[ "$actual" == "$SWIFT_VERSION" ]] || {
            echo "::error::Expected Swift $SWIFT_VERSION, got ${actual:-no version}" >&2
            exit 1
          }
          echo "Swift $actual: $swift_bin"
          printf '%s\n' "$swift_bin" >> "$GITHUB_PATH"
      - name: Emit the Swift symbol graph
        if: matrix.port == 'swift'
        working-directory: port
        run: >-
          swift build --force-resolved-versions --enable-all-traits
          --jobs 2
          -Xswiftc -emit-symbol-graph
          -Xswiftc -emit-symbol-graph-dir -Xswiftc "$PWD/symbolgraph"

      - name: Build this port's tree
        working-directory: docs
        env:
          LIBTMUX_DOCS_PORT: ${{ matrix.port }}
          LIBTMUX_DOCS_VERSION: ${{ matrix.version }}
          LIBTMUX_DOCS_VERSION_KIND: ${{ matrix.kind }}
          LIBTMUX_DOCS_IS_DEFAULT: ${{ matrix.isDefault }}
          LIBTMUX_DOCS_RESOLVES_TO: ${{ matrix.resolvesTo }}
          LIBTMUX_DOCS_INPUT_SNAPSHOT: ${{ runner.temp }}/build-inputs.json
          LIBTMUX_DOCS_SOURCE_REF: ${{ needs.identity.outputs.source-ref }}
          LIBTMUX_DOCS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PORT_CHECKOUT: ${{ github.workspace }}/port
          LIBTMUX_DOCS_WORKSPACE_PY: ${{ github.workspace }}/python-workspace
          LIBTMUX_DOCS_MCP_PY: ${{ github.workspace }}/python-mcp
        run: |
          set -euo pipefail
          [[ "$LIBTMUX_DOCS_PORT" =~ ^[a-z]+$ ]] || {
            echo "invalid port slug: $LIBTMUX_DOCS_PORT" >&2
            exit 1
          }
          export "LIBTMUX_DOCS_CHECKOUT_${LIBTMUX_DOCS_PORT^^}=$PORT_CHECKOUT"
          reference_args=(--skip-refs)
          if [[ "$LIBTMUX_DOCS_PORT" == py ]]; then
            reference_args=()
            export UV_FROZEN=true
          fi
          ./scripts/build-site.sh --ports "$LIBTMUX_DOCS_PORT" \
            --versions "$LIBTMUX_DOCS_VERSION" "${reference_args[@]}" --skip-pagefind
          if [[ "$LIBTMUX_DOCS_PORT" == py ]]; then
            test -s "_site/en/py/$LIBTMUX_DOCS_VERSION/api/objects.inv"
            test -s "_site/en/py/$LIBTMUX_DOCS_VERSION/api/api/index.html"
          fi

      # The version directory itself: its contents become
      # <locale>/<port>/<version>.
      - id: content
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ matrix.port }}-${{ matrix.version }}
          path: docs/_site/en/${{ matrix.port }}/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # Matrix jobs each produce their own descriptor. Run/attempt and archive
      # digest are deliberately outside the immutable version directory.
      - name: Describe the uploaded artifact
        working-directory: docs
        env:
          ARTIFACT_ID: ${{ steps.content.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.content.outputs.artifact-digest }}
          ARTIFACT_NAME: docs-${{ matrix.port }}-${{ matrix.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/publication-provenance.mjs descriptor "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ matrix.port }}-${{ matrix.version }}-publication
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          retention-days: 1
