name: reusable-deploy

# Callers pin this workflow and port-docs.yml to the same full commit SHA.
# Port artifacts carry a deterministic build inventory plus a separate upload
# descriptor. This workflow checks both with code from its own trusted SHA,
# before requesting AWS credentials. GitHub Cloud job.workflow_* is required.
#
# Each call writes its validated locale/port/version prefix and that port's
# manifest fragment. IAM independently limits the role and reviewed workflow
# refs. Immutable versions must match every existing byte; identical reruns
# preserve their original receipt. Mutable versions use a five-minute edge TTL.
#
# Callers own concurrency and dependency updates. A shared concurrency group
# here would merge unrelated queues. Root previews retain their separate
# artifact contract until shared-root provenance is implemented.

on:
  workflow_call:
    inputs:
      path-prefix:
        description: >
          S3 key prefix this call may write, e.g. 'py/v0.46.2', 'py/stable',
          'pr-42'. Validated below, not just documented — this is the one
          thing standing between a caller and every other prefix in the
          bucket.
        required: true
        type: string
      artifact:
        description: Name of the build artifact (from actions/upload-artifact) to publish.
        required: true
        type: string
      version-kind:
        description: >
          A site/src/lib/versions.ts VersionKind: 'trunk' | 'tag' | 'branch'
          | 'pr' | 'alias'. Drives Cache-Control — the caller states what it
          built, this workflow decides how it is cached, so a caller can't
          hand an immutable tag a five-minute TTL by copy-paste.

          This workflow issues no invalidation. A mutable prefix carries
          `s-maxage=300`, so the edge picks a republish up within five
          minutes by itself, and an immutable tag prefix never changes at
          all. The one place invalidation still earns its path is the site's
          entry points, which deploy-shell.yml refreshes.
        required: true
        type: string
      port:
        description: >
          Port slug from site/src/lib/ports.ts (e.g. 'py'). Set to upsert
          this version into manifest/<port>.json; omit to skip the manifest
          step entirely (this repo's own PR previews have no port).
        required: false
        type: string
        default: ''
      version:
        description: Version slug for the manifest entry (VersionEntry.slug), e.g. 'v0.46.2', 'stable'. Required when `port` is set.
        required: false
        type: string
        default: ''
      label:
        description: Display label for the manifest entry (VersionEntry.label). Defaults to `version`.
        required: false
        type: string
        default: ''
      is-default:
        description: Whether this call's version is the port's indexable default (VersionManifest.defaultVersion) — see versions.ts robotsFor().
        required: false
        type: boolean
        default: false
      resolves-to:
        description: For version-kind 'alias' (VersionEntry.resolvesTo), the slug this alias currently points at, e.g. 'v0.46.2'. Ignored for every other version-kind.
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: us-east-1
      environment:
        description: >
          GitHub Environment this call's AWS role assumption runs under
          (e.g. 'docs', 'docs-preview'). Set on this job, not the caller's —
          workflow_call does not support an `environment:` on the calling
          job itself, and this is also the job whose OIDC `sub` claim needs
          `environment:<name>` to match the role's trust policy. The
          environment's deployment branch/tag policy is what actually
          restricts which refs may publish (docs/ci.md).
        required: true
        type: string
    secrets:
      role-arn:
        required: true
      bucket:
        required: true
      # Unused: this workflow issues no invalidation. Optional so callers
      # that still pass it keep working.
      distribution:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # All ten port slugs plus the bucket-root reservations. Every port calls
      # this workflow, so a prefix outside a caller's own slug is refused here
      # as well as by its IAM grant.
      # This is a literal copy of ports.ts, not a checkout of this repo — a
      # cross-repo checkout of a private repo would need a shared credential
      # handed to every caller, exactly the shared-execution risk per-repo
      # prefix ownership exists to avoid. Keep it in sync by hand if PORTS
      # ever gains another entry.
      - name: Validate path-prefix
        env:
          PREFIX_IN: ${{ inputs.path-prefix }}
          PORT_IN: ${{ inputs.port }}
          VERSION_IN: ${{ inputs.version }}
          KIND_IN: ${{ inputs.version-kind }}
          DEFAULT_IN: ${{ inputs.is-default }}
        run: |
          set -euo pipefail
          p="$PREFIX_IN"
          if [[ -z "${PORT_IN:-}" && "${GITHUB_REPOSITORY:-}" != libtmux/docs && "${GITHUB_REPOSITORY:-}" != tony/libtmux-docs ]]; then
            echo "::error::caller '${GITHUB_REPOSITORY:-}' must supply a port and its publication provenance" >&2
            exit 1
          fi
          if [[ ! "$p" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ || "$p" == */ || "$p" == *..* ]]; then
            echo "::error::path-prefix '$p' must be an unrooted path using letters, digits, '.', '_', '-' and '/', without '..'" >&2
            exit 1
          fi
          reserved=(py ruby lua ts rs go java kotlin scala dotnet fsharp cxx swift manifest _shell)
          for r in "${reserved[@]}"; do
            if [[ "$p" == "$r" ]]; then
              echo "::error::path-prefix '$p' is a bare reserved top-level name — qualify it, e.g. '$r/stable'" >&2
              exit 1
            fi
          done
          if [[ -n "${PORT_IN:-}" ]]; then
            case "$PORT_IN" in
              py|ruby|lua|ts|rs|go|java|kotlin|scala|dotnet|fsharp|cxx|swift) ;;
              *) echo "::error::unknown port '$PORT_IN'" >&2; exit 1 ;;
            esac
            if [[ ! "$VERSION_IN" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ || "$VERSION_IN" == *..* ]]; then
              echo "::error::invalid publication version" >&2
              exit 1
            fi
            if [[ -z "$VERSION_IN" || "$VERSION_IN" == */* || "$p" != "$PORT_IN/$VERSION_IN" ]]; then
              echo "::error::port publication prefix must be exactly '$PORT_IN/$VERSION_IN'" >&2
              exit 1
            fi
            if [[ "$KIND_IN" == pr ]]; then
              [[ "$VERSION_IN" =~ ^pr-[0-9]+$ ]] || { echo "::error::PR version must be pr-N" >&2; exit 1; }
              [[ "$DEFAULT_IN" == false ]] || { echo "::error::PR previews cannot be defaults" >&2; exit 1; }
            fi
          elif [[ "$KIND_IN" == pr && ! "$p" =~ ^pr-[0-9]+$ ]]; then
            echo "::error::site preview prefix must be pr-N" >&2
            exit 1
          fi
          # A port's objects live under the locale, like everything else the
          # site serves. Applied here rather than asked of the caller: this
          # workflow is invoked from each port's own repository, and moving
          # the segment would otherwise mean a coordinated edit across ten
          # of them. Validation runs on the caller's own prefix above, so a
          # bare reserved name is still refused before the locale is added.
          #
          # Only a port publish is relocated. A pull-request preview owns its
          # whole prefix and nests the site inside it, so it keeps the shape
          # its own build was given.
          locale="${LIBTMUX_DOCS_LOCALE:-en}"
          if [[ ! "$locale" =~ ^[a-z]{2}(-[A-Z]{2})?$ ]]; then
            echo "::error::invalid publication locale" >&2
            exit 1
          fi
          if [[ -n "${PORT_IN:-}" ]]; then
            p="$locale/$p"
          fi
          echo "PREFIX=$p" >> "$GITHUB_ENV"

      - name: Resolve cache policy from version-kind
        env:
          KIND: ${{ inputs.version-kind }}
        run: |
          set -euo pipefail
          case "$KIND" in
            tag)
              # Immutable tag prefixes never change their bytes once
              # published, so a year-long TTL costs nothing.
              echo "CACHE_CONTROL=public, max-age=31536000, immutable" >> "$GITHUB_ENV"
              ;;
            trunk|branch|pr|alias)
              echo "CACHE_CONTROL=public, max-age=0, s-maxage=300" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unknown version-kind '$KIND'" >&2
              exit 1
              ;;
          esac

      - name: Validate reusable workflow identity
        if: inputs.port != ''
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == libtmux/docs && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub Cloud job.workflow_repository/job.workflow_sha are required" >&2
            exit 1
          }
      - if: inputs.port != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher
          sparse-checkout: |
            scripts
            site/src/lib
          persist-credentials: false
      - if: inputs.port != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - if: inputs.port != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}-publication
          path: publication
          digest-mismatch: error
      - name: Select the builder's exact artifact
        if: inputs.port != ''
        id: descriptor
        env:
          ARTIFACT_NAME: ${{ inputs.artifact }}
        run: node publisher/scripts/publication-provenance.mjs select publication/publication.json
      - if: inputs.port != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.descriptor.outputs.artifact-id }}
          path: archive
          skip-decompress: true
          digest-mismatch: error
      - name: Verify artifact and build provenance
        if: inputs.port != ''
        env:
          ARTIFACT_NAME: ${{ inputs.artifact }}
          PORT: ${{ inputs.port }}
          VERSION: ${{ inputs.version }}
          PUBLISHER_REPOSITORY: ${{ job.workflow_repository }}
          PUBLISHER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          node publisher/scripts/publication-provenance.mjs unpack archive publication/publication.json dist
          node publisher/scripts/publication-provenance.mjs verify dist publication/publication.json "$RUNNER_TEMP/publication-receipt.json"

      # The shared root/preview artifact contract is migrated separately.
      - if: inputs.port == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist
          digest-mismatch: error

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Protect immutable tag contents
        if: inputs.version-kind == 'tag'
        env:
          BUCKET: ${{ secrets.bucket }}
        run: |
          set -euo pipefail
          # One request, capped server-side. `--max-items` paginates in the
          # CLI instead, and there `Contents` came back null whether or not
          # the prefix held anything, so `length(Contents)` failed every tag
          # publish with exit 255 before a byte was written.
          count=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "$PREFIX/" \
            --max-keys 1 \
            --no-paginate \
            --query 'KeyCount' \
            --output text)
          if [[ "$count" != 0 ]]; then
            remote="$RUNNER_TEMP/immutable-existing"
            mkdir -p "$remote"
            aws s3 sync "s3://$BUCKET/$PREFIX/" "$remote/" --only-show-errors
            if ! diff -qr dist "$remote"; then
              echo "::error::immutable tag '$PREFIX' already exists with different bytes" >&2
              exit 1
            fi
            echo "SKIP_SYNC=true" >> "$GITHUB_ENV"
          fi

      - name: Sync to this call's own prefix
        if: env.SKIP_SYNC != 'true'
        env:
          BUCKET: ${{ secrets.bucket }}
        run: |
          set -euo pipefail
          # Scoped to $PREFIX, never the bucket root — the live bug in
          # ~/work/python/libtmux/.github/workflows/docs.yml this design
          # replaces. --delete is safe here because $PREFIX is this call's
          # own exclusive key, validated above.
          aws s3 sync dist/ "s3://$BUCKET/$PREFIX/" \
            --delete \
            --cache-control "$CACHE_CONTROL"

      - name: Upsert manifest/<port>.json
        if: inputs.port != '' && inputs.version-kind != 'pr'
        env:
          BUCKET: ${{ secrets.bucket }}
          PORT: ${{ inputs.port }}
          SLUG: ${{ inputs.version }}
          KIND: ${{ inputs.version-kind }}
          LABEL: ${{ inputs.label }}
          IS_DEFAULT: ${{ inputs.is-default }}
          RESOLVES_TO: ${{ inputs.resolves-to }}
        run: |
          set -euo pipefail
          if [[ -z "$SLUG" ]]; then
            echo "::error::version is required when port is set" >&2
            exit 1
          fi
          key="manifest/${PORT}.json"
          label="${LABEL:-$SLUG}"

          # Derived from the bucket's own manifest key, never appended to —
          # the losing side of a race recomputes from current state instead
          # of retrying stale bytes. manifest/<port>.json is exclusive to
          # this port's own OIDC role, so in steady state there is no other
          # writer; --if-match/--if-none-match is a backstop against a
          # manual re-run racing itself, not the primary correctness
          # mechanism (notes/research/07, "Manifest consistency by
          # construction").
          for attempt in 1 2 3; do
            put_args=(--content-type application/json)
            # Read the document and its ETag together for the conditional write.
            if etag=$(aws s3api get-object \
              --bucket "$BUCKET" --key "$key" --query ETag --output text \
              "$RUNNER_TEMP/manifest-current.json" 2>"$RUNNER_TEMP/manifest-read-error.txt"); then
              current=$(cat "$RUNNER_TEMP/manifest-current.json")
              put_args+=(--if-match "$etag")
            else
              read_status=$?
              if ! grep -Eq '^An error occurred \((404|NoSuchKey)\) when calling the GetObject operation:' "$RUNNER_TEMP/manifest-read-error.txt"; then
                echo "::error::could not read $key" >&2
                cat "$RUNNER_TEMP/manifest-read-error.txt" >&2
                exit "$read_status"
              fi
              current='{"schema":1,"ports":{},"defaultVersion":{}}'
              put_args+=(--if-none-match "*")
            fi

            jq -n \
              --argjson doc "$current" \
              --arg port "$PORT" \
              --arg slug "$SLUG" \
              --arg label "$label" \
              --arg kind "$KIND" \
              --argjson isDefault "$IS_DEFAULT" \
              --arg resolvesTo "$RESOLVES_TO" \
              --slurpfile receipt "$RUNNER_TEMP/publication-receipt.json" \
              --arg skipSync "${SKIP_SYNC:-false}" \
              '
              # Both bindings are parenthesised because `as` binds looser than
              # `+`: `A + B as $x | C` is `A + (B as $x | C)`, which added the
              # entry array to the rest of the pipeline and failed with
              # "array and object cannot be added".
              ($doc.ports[$port] // []) as $existing
              | ($existing | map(select(.slug == $slug)) | first) as $previous
              | (if $kind == "tag" and $skipSync == "true" and $previous.publication != null
                    then if $previous.publication.build == $receipt[0].build and $previous.publication.destination == $receipt[0].destination
                      then $previous.publication
                      else error("immutable publication receipt disagrees with verified bytes") end
                    else $receipt[0] + {operation: (if $skipSync == "true" then "verified-existing" else "published" end)} end) as $publication
              | ({slug: $slug, label: $label, kind: $kind, supported: true, publication: $publication}
                + (if $kind == "alias" and $resolvesTo != "" then {resolvesTo: $resolvesTo} else {} end)
              ) as $entry
              | (($existing | map(select(.slug != $slug))) + [$entry]) as $entries
              | $doc
              | .ports[$port] = $entries
              | if $isDefault then .defaultVersion[$port] = $slug else . end
              ' > "$RUNNER_TEMP/manifest-fragment.json"

            if aws s3api put-object \
              --bucket "$BUCKET" \
              --key "$key" \
              --body "$RUNNER_TEMP/manifest-fragment.json" \
              "${put_args[@]}" >/dev/null 2>"$RUNNER_TEMP/put-error.txt"; then
              if [[ "${SKIP_SYNC:-false}" == true ]]; then
                echo "Verified identical immutable bytes for $PREFIX; any original receipt was preserved." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Published $PREFIX; provenance is recorded in $key." >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi

            if grep -qi 'PreconditionFailed\|412' "$RUNNER_TEMP/put-error.txt"; then
              echo "manifest write raced on attempt $attempt, re-reading and retrying" >&2
              continue
            fi

            cat "$RUNNER_TEMP/put-error.txt" >&2
            exit 1
          done
          echo "::error::manifest/${PORT}.json still conflicting after 3 attempts" >&2
          exit 1
