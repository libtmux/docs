packages:
  - packages/*
  - site
catalog:
  '@biomejs/biome': 2.6.2
  entities: 7.0.1
  happy-dom: ^21.0.1
  oxlint: ^1.88.0
  tree-sitter-wasms: ^0.1.13
  # Pinned exactly, not caret: the prebuilt grammars are ABI 13-14 and runtime
  # 0.26/0.27 reject them — 0.27 by throwing a bare Error from deep inside its
  # WASM loader, which reads like a corrupt file rather than a version skew.
  web-tree-sitter: 0.25.10
  oxlint-tsgolint: ^7.0.2004
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vitest: ^5.0.4
allowBuilds:
  esbuild: true
  sharp: true
  # The extractor loads this package's prebuilt WASM grammar.
  tree-sitter-scala: false
minimumReleaseAge: 4320
minimumReleaseAgeStrict: false
patchedDependencies:
  # Cancel viewport prefetch for links removed by a client navigation.
  astro@7.4.2: patches/astro@7.4.2.patch
